# Configuração do gitleaks para este repositório (modelo do atlas-migração).
# Mantém TODAS as regras padrão e abre uma única exceção, restrita por caminho: as
# assinaturas SHA-256 gravadas pelo gate de revelação (data/processed/.gate_ok), citadas nos
# relatórios de revelação e no manifesto dos dados do painel são somas de verificação públicas
# de integridade, não credenciais — mas têm 64 caracteres hexadecimais e casam com regras de token.
title = "Urbanização de Canaã dos Carajás"

[extend]
useDefault = true

[[allowlists]]
description = "Assinaturas SHA-256 do gate de revelação e do manifesto do painel (integridade)"
paths = [
  '''^data/processed/\.gate_ok$''',
  '''^docs/relatorio_revelacao_[0-9a-z-]+\.md$''',
  '''^web/public/data/painel/_manifesto\.json$''',
]
regexes = ['''\b[0-9a-f]{64}\b''']
